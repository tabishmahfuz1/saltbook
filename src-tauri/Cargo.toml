[package]
name = "saltbook"
version = "0.1.0"
description = "Saltbook — Pharmaceutical ERP, Billing, Inventory & Accounting"
authors = ["Saltbook"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "saltbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
calamine = "0.24"
axum = "0.7"
tokio = { version = "1", features = ["net", "rt", "sync"] }
urlencoding = "2"
csv = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
